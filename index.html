<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7b1c1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="祺祺生活台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<link rel="icon" href="icon192.png">
<title>祺祺的生活工作台</title>
<style>
:root{
  --pink:#f78ea4; --pink-soft:#fdeef2; --pink-deep:#e96a86;
  --bg:#fdf3f5; --card:#ffffff; --text:#5b4a4f; --muted:#b79da4;
  --line:#f3e3e7; --green:#6fbf8f; --yellow:#e8b84a; --red:#e25c6a;
  --blue:#7fb3d5; --gold:#f1b93c;
  --shadow:0 2px 12px rgba(233,106,134,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px;
  overflow:hidden; position:fixed; inset:0;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img{max-width:100%;}
.hidden{display:none!important;}

/* ===== App container ===== */
#app{display:flex;height:100vh;height:100dvh;}

/* ===== Sidebar ===== */
#sidebar{
  width:200px; min-width:200px; background:#fff;
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  transition:transform .25s ease; z-index:50;
}
.menu-head{padding:22px 18px 14px;border-bottom:1px solid var(--line);}
.menu-head .logo{font-size:20px;font-weight:700;color:var(--pink-deep);letter-spacing:.5px;}
.menu-head .sub{font-size:11px;color:var(--muted);margin-top:3px;}
#menuNav{flex:1;overflow-y:auto;padding:8px;}
.menu-item{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;
  color:var(--text);cursor:pointer;margin-bottom:3px;position:relative;transition:background .15s;
}
.menu-item .ic{font-size:19px;width:24px;text-align:center;}
.menu-item .lb{font-size:14.5px;font-weight:500;}
.menu-item .cnt{margin-left:auto;font-size:11px;color:var(--muted);}
.menu-item.active{background:var(--pink-soft);color:var(--pink-deep);font-weight:600;}
.menu-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:3px;background:var(--pink);}
.menu-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7;}
.menu-foot .size{font-size:10px;color:var(--muted);}

/* ===== Main ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#topbar{
  background:linear-gradient(90deg,#fbc0cd,#f9a9bb); padding:16px 16px 12px;color:#fff;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
#topbar .burger{font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;}
#topbar .burger:active{background:rgba(255,255,255,.3);}
#topbar .t-title{font-size:19px;font-weight:700;flex:1;letter-spacing:.5px;}
#topbar .t-date{font-size:11px;opacity:.95;text-align:right;line-height:1.5;}
#content{flex:1;overflow-y:auto;padding:14px 14px 90px;}

/* ===== Stat cards ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat{background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.stat .pic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.stat .num{font-size:24px;font-weight:700;line-height:1;}
.stat .cap{font-size:11.5px;color:var(--muted);margin-top:4px;}
.stat.warn{outline:2px solid var(--yellow);outline-offset:-2px;}

/* ===== Filter chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.chip{
  padding:7px 14px;border-radius:20px;background:#fff;font-size:13px;color:var(--text);
  border:1px solid var(--line);display:flex;align-items:center;gap:5px;
}
.chip.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.chip .dot{width:8px;height:8px;border-radius:50%;}

/* ===== Search & buttons ===== */
.tools{display:flex;align-items:center;gap:9px;margin:10px 0;}
.btn{
  padding:8px 15px;border-radius:20px;background:var(--pink);color:#fff;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(233,106,134,.3);
}
.btn:active{transform:scale(.97);}
.btn.ghost{background:#fff;color:var(--pink-deep);border:1px solid var(--pink);box-shadow:none;}
.search{
  flex:1;display:flex;align-items:center;gap:7px;background:#fff;border-radius:22px;
  padding:9px 14px;box-shadow:var(--shadow);
}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:14px;}
.search .ic{color:var(--muted);font-size:14px;}

/* ===== List cards ===== */
.card{background:#fff;border-radius:16px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;}
.row{display:flex;align-items:center;gap:12px;}
.card .main{flex:1;min-width:0;}
.card .name{font-size:15.5px;font-weight:600;}
.card .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.pill{font-size:12px;padding:4px 10px;border-radius:14px;font-weight:600;white-space:nowrap;}
.pill.green{background:#e6f5ec;color:var(--green);}
.pill.orange{background:#fdf3e2;color:var(--yellow);}
.pill.red{background:#fbe6e8;color:var(--red);}
.pill.pink{background:var(--pink-soft);color:var(--pink-deep);}
.pill.blue{background:#e9f2f8;color:var(--blue);}
.del{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);font-size:16px;}
.del:active{background:var(--pink-soft);color:var(--red);}
.edit{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);font-size:15px;}
.edit:active{background:var(--pink-soft);color:var(--pink-deep);}

/* progress bar */
.prog{height:5px;background:#f3e3e7;border-radius:3px;margin-top:9px;overflow:hidden;}
.prog>div{height:100%;border-radius:3px;background:var(--pink);}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tag{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--pink-soft);color:var(--pink-deep);}

/* ===== Closet grid ===== */
.closet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.closet-item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;}
.closet-item .ph{aspect-ratio:3/4;background:#f7eef1;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
.closet-item .ph img{width:100%;height:100%;object-fit:cover;}
.closet-item .ci-body{padding:8px 10px;}
.closet-item .ci-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.closet-item .ci-meta{font-size:10.5px;color:var(--muted);margin-top:2px;}
.closet-item .ci-x{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.35);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2;}
.outfit-sel.selected{outline:3px solid var(--pink);outline-offset:-3px;background:#fdeef2;}

/* empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .big{font-size:44px;margin-bottom:10px;}

/* ===== Iceberg ===== */
#icebergWrap{position:relative;}
#iceberg{
  overflow-x:auto;overflow-y:hidden;position:relative;
  background:linear-gradient(180deg,#bfe3f2 0%,#e9f7fb 42%,#dceef3 46%,#f3eef2 47%,#fbf4f6 100%);
  border-radius:18px;border:1px solid var(--line);
  -webkit-overflow-scrolling:touch;
}
#icebergInner{position:relative;padding:14px 14px 30px;min-width:max-content;}
.ice-head{position:sticky;top:0;left:0;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);padding:10px;text-align:center;z-index:6;font-weight:600;font-size:14px;color:#3f6f88;border-radius:12px;margin-bottom:10px;min-width:520px;}
.ice-toolbar{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px;min-width:520px;}
.ice-zoom{font-size:13px;color:#4a7d95;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:16px;}
.ice-grid{display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0 4px;}
.ice-row{display:flex;gap:6px;justify-content:center;}
.ice-cell{
  width:52px;min-width:52px;aspect-ratio:4/3;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;padding:2px;text-align:center;transition:transform .15s;cursor:pointer;position:relative;
  background:#fff;color:#8a9aa3;border:1px solid #eee;font-weight:500;flex-shrink:0;
}
.ice-cell.lit{
  background:linear-gradient(135deg,#f9a9bb,#f7809b);color:#fff;border-color:transparent;
  font-weight:600;
}
.ice-cell .txt{line-height:1.1;max-width:100%;overflow:hidden;font-size:9.5px;}
.ice-hint{text-align:center;font-size:11px;color:#4a7d95;margin:8px 4px 0;letter-spacing:.5px;min-width:520px;}
.hover-name{
  position:absolute;background:rgba(50,50,60,.92);color:#fff;padding:4px 8px;border-radius:6px;
  font-size:12px;pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.ice-wave{text-align:center;font-size:11px;color:#4a7d95;margin:6px 0 2px;letter-spacing:2px;}
/* full name display overlay */
#iceList{position:absolute;inset:0;background:#fff;z-index:10;overflow-y:auto;padding:16px;display:none;}
#iceList.show{display:block;}
#iceList .back{color:var(--pink-deep);font-weight:600;font-size:14px;margin-bottom:10px;}
.ice-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:#fff;}
.ice-list-item.lit{background:linear-gradient(135deg,#fdeef2,#fbe3e9);border-color:#f6c3cf;}
.ice-list-item .rank{width:30px;height:30px;border-radius:8px;background:var(--pink-soft);color:var(--pink-deep);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.ice-list-item .nm{flex:1;font-size:14.5px;font-weight:500;}
.ice-list-item .sc{font-size:12px;color:var(--muted);}

/* ===== Calendar (weekend) ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px;}
.cal-head .y-title{font-size:16px;font-weight:700;}
.cal-head .arr{font-size:20px;color:var(--pink-deep);padding:4px 10px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{
  aspect-ratio:1;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;font-size:13px;box-shadow:var(--shadow);
}
.cal-day.blank{background:transparent;box-shadow:none;}
.cal-day .d{line-height:1;}
.cal-day .wk{font-size:9px;color:var(--muted);margin-top:2px;}
.cal-day.weekend .wk{color:var(--pink);}
.cal-day.star::after{content:"★";position:absolute;top:3px;right:5px;font-size:11px;color:var(--gold);}
.cal-day.today{outline:2px solid var(--pink);outline-offset:-2px;}
.cal-day.tap:active{background:var(--pink-soft);}
.cal-legend{display:flex;gap:14px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px;}
.cal-legend .star{color:var(--gold);}
.plan-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;border-left:4px solid var(--pink);}
.plan-card .pd{font-weight:700;font-size:14px;margin-bottom:6px;}
.plan-card .pv{font-size:13px;color:#6f5a60;line-height:1.6;}
.plan-card .plabel{font-size:11px;color:var(--muted);}

/* ===== Festivals ===== */
.fest-card{background:#fff;border-radius:16px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;align-items:center;gap:12px;}
.fest-card .emoji{font-size:24px;}
.fest-card .fbody{flex:1;}
.fest-card .fn{font-size:15px;font-weight:600;}
.fest-card .fd{font-size:12px;color:var(--muted);margin-top:2px;}
.fest-card .fleft{font-size:12px;padding:4px 10px;border-radius:14px;font-weight:600;}

/* ===== Memo / luggage ===== */
.memo-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.memo-card .mt{font-size:14.5px;font-weight:600;margin-bottom:4px;}
.memo-card .mc{font-size:13.5px;color:#6f5a60;line-height:1.6;word-break:break-word;}
.memo-card .mimg{border-radius:10px;margin-top:8px;max-height:180px;object-fit:cover;}
.memo-card .mlink{color:var(--blue);font-size:13px;word-break:break-all;margin-top:6px;text-decoration:underline;}
.memo-card .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--muted);}
.lug-item{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;align-items:center;gap:12px;border-left:4px solid #dfe8ee;}
.lug-item.done{border-left-color:#6abe8f;}
.lug-item .cbx{width:22px;height:22px;border-radius:7px;border:2px solid #d8c8cd;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;}
.lug-item.done .cbx{background:var(--green);border-color:var(--green);}
.lug-item .ln{flex:1;font-size:14.5px;}
.lug-item.done .ln{text-decoration:line-through;color:var(--muted);}
.lug-item .lcat{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef4f7;color:#7d97a5;}

/* ===== Exercise ===== */
.ex-tabs{display:flex;gap:8px;margin-bottom:12px;}
.ex-tab{flex:1;text-align:center;padding:9px;border-radius:12px;background:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow);}
.ex-tab.active{background:var(--pink);color:#fff;}
.ex-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);margin-bottom:9px;}
.ex-row .eic{font-size:22px;width:34px;text-align:center;}
.ex-row .einfo{flex:1;}
.ex-row .en{font-size:14.5px;font-weight:600;}
.ex-row .ed{font-size:12px;color:var(--muted);margin-top:2px;}
.ex-row .ed-dur{font-size:14px;font-weight:700;color:var(--pink-deep);}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(60,30,40,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.modal{
  background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px 30px;
  max-height:88vh;overflow-y:auto;
}
.modal.mid{align-items:center;}
.modal.mid .modal{border-radius:22px;max-width:420px;}
.modal-h{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.form-row{margin-bottom:14px;}
.form-row label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px;}
.form-row input,.form-row textarea,.form-row select{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fdfafb;font-size:14.5px;outline:none;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--pink);}
.form-row textarea{min-height:70px;resize:vertical;}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.opt{padding:6px 12px;border-radius:16px;background:#f6eff1;font-size:13px;border:1px solid transparent;}
.opt.on{background:var(--pink);color:#fff;border-color:var(--pink);}
.modal-ft{display:flex;gap:10px;margin-top:20px;}
.modal-ft .btn{flex:1;justify-content:center;}
.photo-preview{width:100%;border-radius:12px;margin-top:8px;max-height:200px;object-fit:cover;}

/* toast */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(40,30,34,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center;}
#toast.show{opacity:1;}

/* ===== Overlay drawer for mobile ===== */
#drawerMask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
body.drawer-open #drawerMask{opacity:1;pointer-events:auto;}
body.drawer-open #sidebar{transform:translateX(0);}

/* mobile: sidebar off-canvas */
@media (max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:60;width:230px;}
  body.drawer-open #sidebar{transform:translateX(0);}
}
@media (min-width:821px){
  #drawerMask{display:none;}
  #topbar .burger{visibility:hidden;}
}

/* scrollbar */
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="menu-head">
      <div class="logo">🌸 祺祺生活台</div>
      <div class="sub">祺祺并并有条</div>
    </div>
    <nav id="menuNav"></nav>
    <div class="menu-foot">
      <div id="storeInfo">本地存储 0 KB</div>
      <button class="btn ghost" style="width:100%;justify-content:center;margin-top:8px;font-size:12px;" onclick="exportData()">导出数据</button>
      <button class="btn ghost" style="width:100%;justify-content:center;margin-top:6px;font-size:12px;" onclick="importData()">导入数据</button>
    </div>
  </aside>
  <div id="drawerMask" onclick="closeDrawer()"></div>

  <!-- Main -->
  <section id="main">
    <div id="topbar">
      <button class="burger" onclick="toggleDrawer()">☰</button>
      <div class="t-title" id="topTitle">祺祺生活台</div>
      <div class="t-date" id="topDate"></div>
    </div>
    <div id="content"></div>
  </section>
</div>

<div id="toast"></div>

<script src="data-books.js"></script>
<script src="data-movies.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
